<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#f7faff"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="45" y="53" font-size="28" font-weight="700" fill="#203d67">OpenRouter · 같은 이미지와 텍스트로 독립 검토</text><text x="45" y="88" font-size="17" fill="#57718e">Gemini 3.1 Flash-Lite 이후, 근거가 부족한 상품의 추가 검토</text><rect x="45" y="115" width="1110" height="48" rx="8" fill="#eaf1fb" stroke="#b8cce6"/><text x="600" y="146" text-anchor="middle" font-size="19" fill="#315681">같은 원본 이미지 + 판매자 텍스트 + 카테고리 기준</text><path d="M220 163V190" stroke="#92abc9" stroke-width="2"/><rect x="45" y="190" width="350" height="205" rx="12" fill="white" stroke="#b8cce6" stroke-width="2"/><image x="196" y="212" width="48" height="48" href="data:image/svg+xml;base64,"/><text x="220" y="299" text-anchor="middle" font-size="25" font-weight="700" fill="#28496e">Qwen3.7 Flash</text><text x="220" y="330" text-anchor="middle" font-size="16" fill="#687f98">Alibaba · 답안 A</text><text x="220" y="367" text-anchor="middle" font-size="16" fill="#416d86">서로의 답과 앞선 판정을 보지 않음</text><path d="M220 395V416" stroke="#92abc9" stroke-width="2"/><path d="M600 163V190" stroke="#92abc9" stroke-width="2"/><rect x="425" y="190" width="350" height="205" rx="12" fill="white" stroke="#b8cce6" stroke-width="2"/><image x="576" y="212" width="48" height="48" href="data:image/svg+xml;base64,"/><text x="600" y="299" text-anchor="middle" font-size="25" font-weight="700" fill="#28496e">GLM 5.3 Flash</text><text x="600" y="330" text-anchor="middle" font-size="16" fill="#687f98">Z.ai · 답안 B</text><text x="600" y="367" text-anchor="middle" font-size="16" fill="#416d86">서로의 답과 앞선 판정을 보지 않음</text><path d="M600 395V416" stroke="#92abc9" stroke-width="2"/><path d="M980 163V190" stroke="#92abc9" stroke-width="2"/><rect x="805" y="190" width="350" height="205" rx="12" fill="white" stroke="#b8cce6" stroke-width="2"/><image x="956" y="212" width="48" height="48" href="data:image/svg+xml;base64,"/><text x="980" y="299" text-anchor="middle" font-size="25" font-weight="700" fill="#28496e">Reka Edge</text><text x="980" y="330" text-anchor="middle" font-size="16" fill="#687f98">Reka · 답안 C</text><text x="980" y="367" text-anchor="middle" font-size="16" fill="#416d86">서로의 답과 앞선 판정을 보지 않음</text><path d="M980 395V416" stroke="#92abc9" stroke-width="2"/><rect x="45" y="416" width="1110" height="53" rx="8" fill="#eaf5f1" stroke="#acd1c1"/><text x="600" y="449" text-anchor="middle" font-size="20" fill="#256f58">세 답안이 모인 뒤 공개 → 동일 분류 후보와 이미지·텍스트 근거 비교</text><text x="45" y="511" font-size="16" fill="#657e95">선정 모델을 설명한 정적 설계도 · 실제 API 응답, 상품 분류 성능 또는 실행 캡처가 아닙니다.</text></g></svg>